    let text = $("#ctText")?.value.trim() || "";
    if (f && inp?.files?.[0] && S.sample) {
      // read every page once, then fill the fields from the full text
      const t = await contractText(f, "", m => { if (msg) msg.textContent = m; }).catch(err => { console.warn(err); return ""; });
      if (t) { text = t; $("#ctText").value = t; inp.value = ""; }
    }
    if (f || text) S._ctPending = { f, text };
    await x0();
    if (!f && !text) return;
    if (id && empById(id)) {
      try { await saveContractFile(id, f, text); S._ctKept = true; if (msg) msg.textContent += " وحُفظ العقد كامل في ملف الموظف."; } catch (err) { console.warn(err); if (msg) msg.textContent += " تعذّر حفظ ملف العقد، بيتحفظ لما تضغط حفظ الموظف."; }
    } else if (msg) msg.textContent += " العقد بيتحفظ في ملف الموظف لما تضغط حفظ الموظف.";
  };
  const s0 = saveEmpForm; saveEmpForm = async form => {
    const pend = S._ctPending || {}, f = $("#ctFile")?.files?.[0] || pend.f || null, pasted = $("#ctText")?.value.trim() || pend.text || "", id = S._editing?.id;
    await s0(form);
    if (!S._ctKept && (f || pasted) && id && empById(id)) {
      try { await saveContractFile(id, f, pasted); S._ctKept = true; S._ctPending = null; toast("حُفظ العقد في ملف الموظف"); if (dlg.open) empFile(id); } catch (err) { console.warn(err); toast("حُفظ الموظف، لكن تعذّر حفظ ملف العقد. جرّب ترفعه مرة ثانية."); }
    }
  };
  // advisor: full contract text on request
  TOOLS.push({ name: "get_contract", description: "يعيد عقد العمل المحفوظ للموظف: اسم الملف وتاريخ حفظه ونص العقد كاملًا (البنود، المدة، الأجر، الإجازات، الإشعار، عدم المنافسة...). استخدمه لأي سؤال عن بنود عقد موظف أو تفاصيله.", inputSchema: { type: "object", properties: { employee: { type: "string" } }, required: ["employee"] },
    execute: q => { const e = findEmp(q.employee); if (!e) return { error: "الموظف غير موجود" }; const c = ctOf(e.id); return c ? { employee: e.name, fileName: c.fileName || "", savedAt: c.uploadedAt || c.updatedAt, contractText: c.text || "النص غير محفوظ", clauses: e.clauses || [], contractRisks: e.contractRisks || [] } : { employee: e.name, contract: "لا يوجد عقد محفوظ لهذا الموظف" }; } });
  const t = TOOLS.find(x => x.name === "get_employee");
  if (t) { const ex = t.execute; t.execute = q => { const r = ex(q), e = findEmp(q.employee), c = e ? ctOf(e.id) : null; return c ? { ...r, contractOnFile: true, contractText: (c.text || "").slice(0, 12000) } : { ...r, contractOnFile: false }; }; }
})();
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "ctView") return ctView(id, t);
  if (a === "ctSave") return ctSave(id);
  if (a === "ctReread") return ctReread(id, t);
  if (a === "ctShow") { const b = $("#ctTextBox"); b.hidden = !b.hidden; t.textContent = b.hidden ? "قراءة نص العقد" : "إخفاء النص"; }
});
(async () => {
  if (!window.claude?.use) return;
  for (let i = 0; i < 40 && !S.db && !S.local; i++) await new Promise(r => setTimeout(r, 250));
  if (S.db) S.db.collection("contracts").onSnapshot(s => { S.contracts = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); }, e => console.warn(e));
})();

/* ===== PIN screen on open (privacy screen; the artifact itself is already private to the account) ===== */
async function pinHash(p) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hr-pin:" + p)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const PIN_DEFAULT = "123456";
const ADMIN_HASH = "9d994ef7087f131c37a0aece5436cf5946427457fb784a9298d318ab559aa9ba";
const adminOk = async p => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("hr-admin:" + p)))].map(x => x.toString(16).padStart(2, "0")).join("") === ADMIN_HASH;
const pinOk = async p => { for (let i = 0; i < 40 && !S.setLoaded && !S.local && window.claude?.use; i++) await new Promise(r => setTimeout(r, 250)); return pinCheck(p); };
const pinCheck = async p => (await pinHash(p)) === (S.settings.pinHash || await pinHash(PIN_DEFAULT));
function unlocked() { try { return sessionStorage.getItem("hr-unlocked") === "1"; } catch { return false; } }
function showLock() {
  if (document.getElementById("lock")) return;
  const el = document.createElement("div"); el.id = "lock";
  el.innerHTML = `<form class="lock-box" autocomplete="off"><div class="logo" style="margin:0 auto 12px">HR</div><h2>قسم الموارد البشرية HR</h2><p class="small muted">أدخل الرقم السري للدخول</p>
    <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autofocus aria-label="الرقم السري">
    <div class="small" id="pinMsg" style="color:var(--bad);min-height:1.4em"></div><button class="btn primary" style="width:100%;justify-content:center">دخول</button></form>`;
  document.body.appendChild(el);
  const f = el.querySelector("form"), inp = el.querySelector("#pinIn"); let tries = 0;
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (await pinOk(inp.value.trim())) { try { sessionStorage.setItem("hr-unlocked", "1"); } catch { } el.remove(); return; }
    tries++; inp.value = ""; el.querySelector("#pinMsg").textContent = tries >= 5 ? "محاولات كثيرة، انتظر 30 ثانية." : "الرقم السري غير صحيح.";
    if (tries >= 5) { inp.disabled = true; setTimeout(() => { inp.disabled = false; tries = 0; el.querySelector("#pinMsg").textContent = ""; inp.focus(); }, 30000); }
  });
  setTimeout(() => inp.focus(), 50);
}
function lockNow() { try { sessionStorage.removeItem("hr-unlocked"); } catch { } if (dlg.open) closeDlg(); showLock(); }
function pinPanel() {
  return `<div class="panel section"><h3>الرقم السري للدخول</h3><div class="small muted">يُطلب عند فتح النظام، وتغييره يحتاج كلمة مرور المدير. ${S.settings.pinHash ? "" : "الرقم الحالي هو الافتراضي 123456، ويُنصح بتغييره."}</div>
  <div class="form"><label class="f">كلمة مرور المدير<input type="password" id="pin_old" autocomplete="off"></label><label class="f">الرقم الجديد (4 أرقام أو أكثر)<input type="password" inputmode="numeric" id="pin_new"></label><label class="f">تأكيد الرقم الجديد<input type="password" inputmode="numeric" id="pin_new2"></label></div>
  <div class="toolbar"><button class="btn primary" data-act="savePin">تغيير الرقم السري</button><button class="btn" data-act="lockNow">قفل النظام الآن</button></div></div>`;
}
async function savePin() {
  const o = $("#pin_old").value.trim(), n = $("#pin_new").value.trim(), n2 = $("#pin_new2").value.trim();
  if (!(await adminOk(o))) return toast("كلمة مرور المدير غير صحيحة");
  if (!/^\d{4,12}$/.test(n)) return toast("الرقم الجديد لازم يكون 4 أرقام أو أكثر");
  if (n !== n2) return toast("الرقمين غير متطابقين");
  const d = { pinHash: await pinHash(n) };
  if (S.local) { S.settings = { ...S.settings, ...d }; toast("تغيّر الرقم السري"); render(); return; }
  try { await S.db.doc("settings/company").set({ ...S.settings, ...d }); logAudit("تغيير الرقم السري", ""); toast("تغيّر الرقم السري"); } catch (e) { writeErr(e); }
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  if (t.dataset.act === "savePin") savePin();
  if (t.dataset.act === "lockNow") lockNow();
});
if (!unlocked()) showLock();
</script>

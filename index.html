<script>
/* HR app: on-device storage for the installed app (outside claude.ai).
   Provides the same window.claude.use("db" | "user" | "downloads" | "assets") the system uses on claude.ai,
   backed by IndexedDB, so all data stays on this device. On claude.ai the real runtime is used and this file does nothing. */
(function () {
  if (window.claude && window.claude.use) return;

  const DB_NAME = "hr-app", DB_VER = 1;
  const mem = new Map();          // "collection/id" -> data
  const subs = new Set();         // live listeners
  let idb;
  const urls = {};
  window.hrBlobUrl = id => urls[id] || "#";

  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = tx => new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error); });
  const clone = v => v == null ? v : structuredClone(v);
  const newId = () => [...crypto.getRandomValues(new Uint8Array(16))].map(x => x.toString(16).padStart(2, "0")).join("");

  const ready = (async () => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); };
    idb = await req(r);
    const tx = idb.transaction("docs"), st = tx.objectStore("docs");
    const [keys, vals] = await Promise.all([req(st.getAllKeys()), req(st.getAll())]);
    keys.forEach((k, i) => mem.set(k, vals[i]));
    const bs = idb.transaction("blobs").objectStore("blobs");
    const [bk, bv] = await Promise.all([req(bs.getAllKeys()), req(bs.getAll())]);
    bk.forEach((k, i) => urls[k] = URL.createObjectURL(bv[i].blob));
    try { await navigator.storage?.persist?.(); } catch { }
  })();

  /* ---------- documents ---------- */
  function docSnap(path) {
    const has = mem.has(path), v = mem.get(path);
    return { id: path.split("/").pop(), exists: has, data: () => has ? clone(v) : undefined, ref: docRef(path) };
  }
  function collSnap(q) {
    const pre = q.coll + "/";
    let docs = [...mem.keys()].filter(k => k.startsWith(pre) && !k.slice(pre.length).includes("/")).map(docSnap);
    if (q.order) {
      const [f, dir] = q.order, s = dir === "desc" ? -1 : 1;
      docs.sort((a, b) => { const x = a.data()?.[f], y = b.data()?.[f]; return x == y ? 0 : x == null ? 1 : y == null ? -1 : (x < y ? -1 : 1) * s; });
    }
    if (q.lim) docs = docs.slice(0, q.lim);
    return { docs, size: docs.length, empty: !docs.length, forEach: fn => docs.forEach(fn) };
  }
  function notify(path) {
    for (const s of subs) {
      const hit = s.doc ? s.doc === path : path.startsWith(s.q.coll + "/") && !path.slice(s.q.coll.length + 1).includes("/");
      if (hit) try { s.cb(s.doc ? docSnap(s.doc) : collSnap(s.q)); } catch (e) { console.warn(e); }
    }
  }
  async function write(path, val) {
    await ready;
    const tx = idb.transaction("docs", "readwrite");
    val === undefined ? tx.objectStore("docs").delete(path) : tx.objectStore("docs").put(val, path);
    await done(tx);
    val === undefined ? mem.delete(path) : mem.set(path, val);
    notify(path);
  }
  function listen(s, cb) {
    const sub = { ...s, cb };
    subs.add(sub);
    ready.then(() => { if (subs.has(sub)) cb(s.doc ? docSnap(s.doc) : collSnap(s.q)); });
    return () => subs.delete(sub);
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      async get() { await ready; return docSnap(path); },
      set: (data, opt) => write(path, clone(opt?.merge ? { ...(mem.get(path) || {}), ...data } : data)),
      update: data => write(path, clone({ ...(mem.get(path) || {}), ...data })),
      delete: () => write(path, undefined),
      onSnapshot: cb => listen({ doc: path }, cb),
      collection: name => collRef(path + "/" + name),
    };
  }
  function query(q) {
    return {
      orderBy: (f, dir = "asc") => query({ ...q, order: [f, dir] }),
      limit: n => query({ ...q, lim: n }),
      async get() { await ready; return collSnap(q); },
      onSnapshot: cb => listen({ q }, cb),
    };
  }
  function collRef(coll) {
    return {
      ...query({ coll }),
      id: coll.split("/").pop(),
      doc: id => docRef(coll + "/" + (id || newId())),
      async add(data) { const r = docRef(coll + "/" + newId()); await r.set(data); return r; },
    };
  }
  const db = { collection: collRef, doc: docRef };

  /* ---------- files (contracts, warnings) ---------- */
  const assets = {
    async upload(blob, opt = {}) {
      await ready;
      const id = newId(), type = opt.type || blob.type || "application/octet-stream";
      const tx = idb.transaction("blobs", "readwrite"); tx.objectStore("blobs").put({ blob, type }, id); await done(tx);
      urls[id] = URL.createObjectURL(blob);
      return { id, contentType: type, sizeBytes: blob.size, url: urls[id] };
    },
    async delete(id) { await ready; if (urls[id]) { URL.revokeObjectURL(urls[id]); delete urls[id]; } const tx = idb.transaction("blobs", "readwrite"); tx.objectStore("blobs").delete(id); await done(tx); },
  };

  /* ---------- downloads ---------- */
  const downloads = {
    async save({ filename, data, mimeType }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mimeType || "" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename || "file";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
      return { status: "saved" };
    },
  };

  /* ---------- user (single owner on this device) ---------- */
  const user = { id: async () => "local", me: async () => null, profiles: async () => ({}), isOwner: async () => true };

  const caps = { db, user, downloads, assets };
  window.claude = {
    use: async name => {
      if (!caps[name]) throw { code: "capability_disabled" };
      await ready; return caps[name];
    },
  };

  /* ---------- backup / restore (settings screen) ---------- */
  const b64 = async blob => { const u = new Uint8Array(await blob.arrayBuffer()); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s, type) => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };

  async function exportBackup() {
    await ready;
    const st = idb.transaction("blobs").objectStore("blobs");
    const [keys, vals] = await Promise.all([req(st.getAllKeys()), req(st.getAll())]);
    const blobs = {};
    for (let i = 0; i < keys.length; i++) blobs[keys[i]] = { type: vals[i].type, data: await b64(vals[i].blob) };
    const out = { app: "hr-system", format: 1, exportedAt: new Date().toISOString(), docs: Object.fromEntries(mem), blobs };
    const d = new Date().toISOString().slice(0, 10);
    await downloads.save({ filename: `HR-backup-${d}.json`, data: JSON.stringify(out), mimeType: "application/json" });
  }
  async function importBackup(file) {
    let j; try { j = JSON.parse(await file.text()); } catch { return alert("الملف غير صالح."); }
    if (j?.app !== "hr-system" || !j.docs) return alert("هذا الملف ليس نسخة احتياطية من نظام الموارد البشرية.");
    if (!confirm(`سيتم استبدال كل البيانات على هذا الجهاز بالنسخة المحفوظة بتاريخ ${String(j.exportedAt || "").slice(0, 10)}. متأكد؟`)) return;
    await ready;
    const tx = idb.transaction(["docs", "blobs"], "readwrite"), ds = tx.objectStore("docs"), bs = tx.objectStore("blobs");
    ds.clear(); bs.clear();
    for (const [k, v] of Object.entries(j.docs)) ds.put(v, k);
    for (const [k, v] of Object.entries(j.blobs || {})) bs.put({ blob: unb64(v.data, v.type), type: v.type }, k);
    await done(tx);
    try { sessionStorage.removeItem("hr-unlocked"); } catch { }
    location.reload();
  }

  let installEvt = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; document.querySelectorAll("[data-bk=install]").forEach(b => b.hidden = false); });
  addEventListener("appinstalled", () => { installEvt = null; document.querySelectorAll("[data-bk=install]").forEach(b => b.hidden = true); });

  window.hrBackupPanel = () => `<div class="panel section"><h3>بيانات التطبيق ونسخها الاحتياطي</h3>
    <div class="small muted">بياناتك محفوظة على هذا الجهاز فقط. خذ نسخة احتياطية بشكل دوري، واستخدمها لنقل البيانات لجهاز ثاني.</div>
    <div class="toolbar" style="margin-top:10px"><button type="button" class="btn primary" data-bk="export">تنزيل نسخة احتياطية</button><button type="button" class="btn" data-bk="import">استرجاع نسخة</button><button type="button" class="btn" data-bk="install" ${installEvt ? "" : "hidden"}>تثبيت التطبيق</button></div>
    <input type="file" id="bkFile" accept="application/json,.json" hidden></div>`;

  document.addEventListener("click", async ev => {
    const t = ev.target.closest("[data-bk]"); if (!t) return;
    const a = t.dataset.bk;
    if (a === "export") { t.disabled = true; try { await exportBackup(); } catch (e) { console.warn(e); alert("تعذّر إنشاء النسخة."); } t.disabled = false; }
    if (a === "import") document.getElementById("bkFile")?.click();
    if (a === "install" && installEvt) { installEvt.prompt(); installEvt = null; t.hidden = true; }
  });
  document.addEventListener("change", ev => { if (ev.target.id === "bkFile" && ev.target.files[0]) importBackup(ev.target.files[0]); });

})();

</script>

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}

/* rail */
aside.rail{background:var(--rail);color:var(--rail-ink);border-inline-start:1px solid var(--line);padding:0 10px 0;display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 8px 16px;margin:0 -10px;padding-inline:18px;border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;color:var(--ink);font-weight:600;font-size:14px;line-height:1.4}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:11.5px;color:var(--rail-dim);padding:16px 10px 6px}
nav.tabs button{all:unset;cursor:pointer;padding:8px 10px;border-radius:6px;color:var(--rail-ink);font-weight:500;font-size:14px;display:flex;gap:10px;align-items:center}
nav.tabs button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
nav.tabs button:hover{background:var(--sunk)}
nav.tabs button[aria-selected="true"]{background:var(--rail-active);color:var(--rail-hi);font-weight:600}
nav.tabs button[aria-selected="true"] svg{color:var(--rail-hi)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{margin-inline-start:auto;font-size:11.5px;font-weight:600;background:var(--chip);color:#4A4F54;border-radius:10px;padding:0 6px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.7}
.count.risk{background:var(--bad);color:#fff}
.rail-foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:14px 8px 16px;margin-inline:-10px;padding-inline:18px;border-top:1px solid var(--line);line-height:1.8}

/* shell */
.shell{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:32px;display:flex;align-items:center;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;min-height:56px}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.topbar .spacer{flex:1}
.topbar .date{font-size:12.5px;color:var(--muted);white-space:nowrap}
.me{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
main{padding:28px 32px 72px;min-width:0;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}

/* type */
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.4;font-weight:600}
h1{font-size:22px} h2{font-size:15px} h3{font-size:14.5px}
.sub{color:var(--muted);margin:2px 0 0;font-size:13.5px;max-width:72ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* controls */
.btn{font:inherit;font-size:14px;font-weight:500;cursor:pointer;border-radius:6px;min-height:36px;padding:0 14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:0 16px}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 35%,var(--line2))}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:8px 12px;min-height:36px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[readonly]{background:var(--sunk);color:var(--muted)}
textarea{min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 16px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.check input{width:auto;min-height:0;margin-top:5px;accent-color:var(--accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > h2:first-child,.panel > h3:first-child,.panel > .head:first-child{margin:-18px -18px 0;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel > .list{margin-inline:-18px;margin-bottom:-18px}
.panel > .list > .row{padding-inline:18px}
.section{display:flex;flex-direction:column;gap:12px}

/* figures strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);padding:16px 20px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--bad)} .kpi.money b{color:var(--ink)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row[data-act]:hover{background:var(--sunk)}
.dot{width:7px;height:7px;border-radius:50%;margin-top:8px;flex:none}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.ok{background:var(--ok)}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:4px;padding:1px 8px;white-space:nowrap}
.pill.low,.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.med,.pill.cond{background:var(--warn-soft);color:var(--warn-ink)}
.pill.high,.pill.no{background:var(--bad-soft);color:var(--bad-ink)}
.pill.tag{background:var(--chip);color:var(--muted)}
.art{font-size:11.5px;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:4px;padding:0 6px;cursor:pointer;font-family:inherit;font-weight:600;line-height:1.8;white-space:nowrap}
.art:hover{background:color-mix(in srgb,var(--gold-line) 60%,var(--gold-soft))}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:500;background:var(--surface);padding-block:12px}
tbody tr{cursor:pointer} tbody tr:hover{background:#FAFAF7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) tbody tr:hover{background:var(--sunk)}}
tbody tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:30px;height:30px;font-size:11.5px;background:var(--sunk);color:var(--ink2)}
.empno{font-variant-numeric:tabular-nums;color:var(--faint);font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.left::before{background:var(--faint)}
.status.trial::before{background:var(--warn)} .status.ending::before{background:var(--bad)}

.badge-sample{font-size:11px;background:var(--warn-soft);color:var(--warn-ink);border-radius:4px;padding:0 6px;margin-inline-start:6px;font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:var(--r-s);padding:10px 14px;font-size:13.5px}
.banner.info{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 20%,transparent)}

/* termination options */
.opt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.opt.rec{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.opt-h .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt-h .cost{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.opt-b{padding:0 18px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.opt-b ul{margin:0;padding-inline-start:20px}
.ledger{width:100%}
.ledger td{white-space:normal;padding:8px 0;border-bottom:1px dashed var(--line2);vertical-align:top;font-size:14px}
.ledger td.amt{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap;padding-inline-start:12px}
.ledger tr.total td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink);padding-top:10px}
.recbox{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.report{white-space:pre-wrap;line-height:1.9;font-size:14.5px;max-width:82ch}
.report:empty::before{content:"لم يُعد التقرير بعد.";color:var(--muted)}

/* law */
.law{display:flex;flex-direction:column;gap:10px;max-width:900px}
.law article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;scroll-margin-top:80px}
.law article.flash{box-shadow:0 0 0 2px var(--accent)}
.law .n{color:var(--gold);font-weight:600}
.law p{margin:6px 0;max-width:78ch;color:var(--ink2);line-height:1.75}
.prec{margin-top:8px}.prec summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px}
.prec-i{border-inline-start:3px solid var(--line2);padding:6px 12px;margin:10px 0;display:grid;gap:4px}
.prec-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.prec-p{font-weight:600}

/* advisor chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:320px}
.msg{max-width:min(760px,92%);padding:10px 15px;border-radius:10px;white-space:pre-wrap;line-height:1.8}
.msg.u{align-self:flex-start;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-end;background:var(--surface);border:1px solid var(--line)}
.msg.sys{align-self:center;color:var(--muted);font-size:13px;background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(960px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 24px 60px -24px rgb(23 25 27 / .35)}
dialog::backdrop{background:rgb(23 25 27 / .4)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{background:var(--surface);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);padding:10px 14px}
.fact span{display:block;font-size:12px;color:var(--muted)}
.fact b{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:6px;font-size:13.5px;z-index:20}
.empty{padding:32px;text-align:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(90px,130px) minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:13.5px}
.bar .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar b{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.letter{direction:rtl;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;line-height:1.95;margin-top:8px;max-height:52vh;overflow:auto}
.letter p{margin:0}.letter:focus{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;width:max-content;gap:2px;background:var(--sunk);padding:3px;border-radius:7px;margin-bottom:14px;max-width:100%;overflow-x:auto}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:5px;font-weight:500;white-space:nowrap;font-size:13.5px;color:var(--ink2)}
.seg button span{font-size:12px;color:var(--faint);margin-inline-start:4px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.seg button:focus-visible{outline:2px solid var(--accent)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;padding:0 12px 8px;gap:6px;border-inline-start:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand{padding:10px 12px 8px;margin:0 -12px;border-bottom:0}
  nav.tabs{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{white-space:nowrap;padding:7px 11px;font-size:13.5px}
  .navlabel,.rail-foot{display:none}
  .topbar{position:static;padding-inline:16px}
  .topbar .date,.me span{display:none}
  .me{border:0;padding:0}
  main{padding:20px 16px 64px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:14px 16px}
  .kpi b{font-size:22px}
  .grid2,.opt-b{grid-template-columns:1fr}
  .letter{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* lock */
#lock{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;padding:16px}
.lock-box{width:100%;max-width:330px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 22px 22px;text-align:center;display:grid;gap:10px}
.lock-box .logo{width:44px;height:44px;font-size:15px;border-radius:9px}
.lock-box h2{margin:0;font-size:16px}.lock-box p{margin:0}
#pinIn{font-size:22px;letter-spacing:8px;text-align:center;padding:10px;direction:ltr}
</style>
</head>
<body>

<div class="app" dir="rtl" lang="ar">
  <aside class="rail">
    <div class="brand"><div class="logo" id="logo">HR</div><div><b id="coName">قسم الموارد البشرية HR</b><small id="coSub"></small></div></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-v="dash" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>الرئيسية</button>
      <button role="tab" data-v="emps"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>شؤون الموظفين <span class="count" id="cEmps">0</span></button>
      <button role="tab" data-v="leaves"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>الإجازات</button>
      <button role="tab" data-v="cases"><svg viewBox="0 0 24 24"><path d="M8 4h8M9 2h6v4H9z"/><path d="M6 4H5a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-1"/><path d="M8 11h8M8 15h5"/></svg>إنهاء الخدمة والحالات <span class="count" id="cCases">0</span></button>
      <button role="tab" data-v="risk"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>مؤشر المخاطر <span class="count risk" id="cRisk" hidden>0</span></button>
      <button role="tab" data-v="nitaq"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>نسبة التوطين</button>
      <div class="navlabel">الدعم</div>
      <button role="tab" data-v="ask"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>المستشار</button>
      <button role="tab" data-v="law"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M5 7l-3 7a3.5 3.5 0 0 0 6 0zM19 7l-3 7a3.5 3.5 0 0 0 6 0zM8 21h8"/></svg>نظام العمل</button>
      <button role="tab" data-v="audit"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>سجل العمليات</button>
      <button role="tab" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
    </nav>
    <div class="rail-foot">مرجع الأنظمة محدّث حتى <span id="lawDate"></span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="crumb" id="crumb"></div><span class="spacer"></span><span class="date" id="today"></span><div class="me"><div class="av" id="meAv">م</div><span id="meName">مدير الموارد البشرية</span></div></header>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
<script>

const LAW_RAW = `#gen
1|التسمية|يسمى هذا النظام نظام العمل.
2|التعريفات|يحدد مصطلحات النظام، ومنها: الحدث من أتم 15 عامًا ولم يبلغ 18، والعمل المؤقت والعرضي لا يتجاوز كل منهما 90 يومًا، والعمل لبعض الوقت أقل من نصف ساعات العمل اليومية، والخدمة المستمرة تشمل الإجازات والغياب بلا أجر حتى 20 يومًا متقطعة في السنة، والأجر الأساسي والأجر الفعلي (يشمل البدلات والميزات العينية بحد أقصى أجر شهرين عن كل سنة)، والشهر 30 يومًا ما لم يُنص على خلافه، والاستقالة إفصاح العامل كتابة دون إكراه عن رغبته في إنهاء العقد، والإسناد.
3|الحق في العمل وعدم التمييز|العمل حق للمواطن، ولا يمارسه غيره إلا بعد توافر الشروط النظامية، والمواطنون متساوون فيه دون تمييز بسبب الجنس أو الإعاقة أو السن.
4|الالتزام بالشريعة|يلتزم صاحب العمل والعامل بأحكام الشريعة الإسلامية عند تطبيق النظام.
5|نطاق التطبيق|يسري النظام على عقود العمل، وعمال الحكومة والمؤسسات العامة، وعمال الجمعيات الخيرية، وعقود التأهيل والتدريب في حدود أحكامه، والعاملين بعض الوقت في حدود السلامة والصحة المهنية وإصابات العمل وما يقرره الوزير.
6|العمال المؤقتون والعرضيون والموسميون|تسري عليهم أحكام الواجبات والتأديب وساعات العمل والراحة والعمل الإضافي والعطلات والسلامة والتعويض عن الإصابات وما يقرره الوزير.
7|الاستثناءات|يُستثنى أفراد أسرة صاحب العمل في منشأة لا تضم غيرهم، ولاعبو الأندية والاتحادات ومدربوها، والعمالة المنزلية، وعمال الزراعة والرعاة الخاصون، وغير السعوديين القادمون لمهمة محددة لا تتجاوز شهرين. ويصدر الوزير لوائح لبعض هذه الفئات.
8|بطلان الشروط المخالفة|يبطل كل شرط يخالف النظام، وكل إبراء أو مصالحة عن حقوق العامل أثناء سريان العقد، إلا إذا كانت أكثر فائدة للعامل.
9|اللغة العربية|تُستخدم العربية في البيانات والسجلات والعقود والتعليمات، وإذا استُخدمت لغة أخرى معها فالنص العربي هو المعتمد.
10|التقويم الهجري|تُحسب المدد والمواعيد بالتقويم الهجري ما لم يُتفق في العقد أو اللائحة على غير ذلك.
11|إسناد الأعمال الأصلية|إذا أسند صاحب العمل عملًا من أعماله الأصلية أو جزءًا منه لصاحب عمل آخر، وجب على الأخير منح عماله الحقوق والمزايا نفسها التي يمنحها الأصلي لعماله.
11 مكرر|تنظيم سوق العمل|للوزير اتخاذ إجراءات لتحسين أداء سوق العمل وتنظيم انتقال الأيدي العاملة.
12|النموذج الموحد للائحة تنظيم العمل|تضع الوزارة نموذجًا موحدًا أو أكثر للائحة تنظيم العمل يشمل المزايا والمخالفات والجزاءات وضوابط اعتمادها.
13|لائحة المنشأة|يُلزم صاحب العمل بإعداد لائحة لمنشأته وفق النموذج، ويجوز إضافة شروط لا تخالف النظام، ويجب إعلانها وأي تعديل عليها في مكان ظاهر.
14|ملغاة|
15|إبلاغ مكتب العمل|يبلغ صاحب العمل مكتب العمل كتابة عند بدء العمل ببيانات المنشأة ونشاطها وسجلها وعدد عمالها واسم المدير المسؤول.
16|ممثل صاحب العمل|إذا لم يتول صاحب العمل الإدارة بنفسه يعين ممثلًا ويبلغ مكتب العمل باسمه، وعند تغييره يبلغ خلال 7 أيام على الأكثر، وتبقى مسؤوليته قائمة.
17|السجلات وجدول المواعيد|يحتفظ صاحب العمل بالسجلات في مكان العمل، ويعلق جدولًا ظاهرًا بمواعيد العمل والراحة ويوم الراحة الأسبوعي والنوبات.
18|انتقال ملكية المنشأة|تبقى العقود نافذة وتُعد الخدمة مستمرة عند انتقال الملكية أو تغير الشكل النظامي، والسلف والخلف متضامنان في الحقوق السابقة. وفي المنشأة الفردية لا تنتقل دون موافقة العامل الكتابية، وله طلب إنهاء عقده واستلام مستحقاته.
19|امتياز مستحقات العامل|مستحقات العامل ديون ممتازة من الدرجة الأولى، وعند الإفلاس أو التصفية يُدفع له معجلًا ما يعادل أجر شهر واحد قبل سائر المصروفات.
20|منع إساءة الاستعمال|يُمنع صاحب العمل والعامل من إساءة استعمال النظام أو الضغط على حرية الآخر بما يخالف حرية العمل.
21|التنسيق مع الجهات|ينسق الوزير مع الجهات ذات العلاقة لتنفيذ أحكام النظام.
#recruit
22|قنوات التوظيف|توفر الوزارة قنوات توظيف مجانية تجمع طالبي العمل وأصحاب الأعمال، وتحلل معلومات سوق العمل.
23|قيد طالبي العمل|لكل مواطن قادر على العمل وراغب فيه قيد اسمه في قنوات التوظيف ببيان مؤهلاته وخبراته وعنوانه.
24|لائحة التوظيف|تحدد اللائحة إجراءات قنوات التوظيف ونماذج السجلات وجداول تصنيف المهن.
25|بيانات الوظائف الشاغرة|يرسل صاحب العمل بيان الوظائف الشاغرة والمستحدثة خلال 15 يومًا، ويبلغ بما اتخذه بشأن المرشح خلال 7 أيام من استلام خطاب الترشيح، ويرسل بيانات العمال وتقرير حالة العمل خلال شهر محرم سنويًا.
26|توظيف السعوديين|على المنشآت استقطاب السعوديين وتوظيفهم وتدريبهم، ولا تقل نسبتهم في النص عن 75% من مجموع العمال، وللوزير خفضها مؤقتًا. وتُطبق عمليًا نسب التوطين التي تحددها الوزارة لكل نشاط.
27|التسجيل قبل التوظيف|للوزير إلزام أصحاب العمل في بعض الأنشطة والمناطق بعدم التوظيف إلا عبر قنوات التوظيف.
28|توظيف ذوي الإعاقة|من يستخدم 25 عاملًا فأكثر وتسمح طبيعة عمله يلزمه تشغيل 4% على الأقل من ذوي الإعاقة المؤهلين، وإبلاغ الوزارة بأعدادهم ووظائفهم وأجورهم.
29|توظيف المصاب بإصابة عمل|إذا نقصت قدرة العامل بسبب إصابة عمل دون أن تمنعه من عمل آخر، يلتزم صاحب العمل بتوظيفه في عمل مناسب بالأجر المحدد له، دون إخلال بتعويضه.
30|ترخيص التوظيف والاستقدام والإسناد|لا يجوز ممارسة توظيف السعوديين أو استقدام العمال أو الإسناد إلا بترخيص من الوزارة.
31|علاقة العامل المستقدم أو المرشح|العمال الذين وظفتهم المكاتب أو استقدمتهم نيابة عن صاحب العمل يُعدون عمالًا لديه بعلاقة عقدية مباشرة.
#nonsaudi
32|موافقة الاستقدام|يشترط موافقة الوزارة قبل استقدام أي شخص للعمل.
33|رخصة العمل|لا يعمل غير السعودي دون رخصة عمل، وشروطها: دخول نظامي، ومؤهل تحتاجه البلاد ولا يتوفر من المواطنين بعدد كافٍ أو من فئة العمال العاديين المحتاج لها، وعقد مع صاحب عمل وتحت مسؤوليته.
34|التصاريح الأخرى|رخصة العمل لا تغني عن تراخيص الجهات الأخرى لمزاولة المهنة.
35|رفض تجديد الرخصة|للوزارة رفض تجديد رخصة العمل إذا خالف صاحب العمل معايير التوطين، مع إجراءات تحمي العامل منها نقل خدماته دون موافقة صاحب العمل المخالف.
36|المهن المقصورة على السعوديين|يحدد الوزير بقرار المهن التي لا يجوز لغير السعودي ممارستها.
37|عقد غير السعودي|يكون مكتوبًا ومحدد المدة، وإذا خلا من المدة عُدت سنة من تاريخ المباشرة الفعلية، وإذا استمر الطرفان في تنفيذه عُد مجددًا لمدة مماثلة.
38|العمل في غير المهنة|لا يجوز توظيف العامل في غير مهنته المدونة في رخصته قبل إتمام إجراءات تغيير المهنة.
39|العمل لدى الغير|لا يجوز ترك العامل يعمل لدى الغير أو لحسابه الخاص، ولا توظيف عامل غيرك، دون الإجراءات النظامية.
40|التكاليف على صاحب العمل|يتحمل صاحب العمل رسوم الاستقدام والإقامة ورخصة العمل وتجديدها وغرامات تأخيرها، ورسوم تغيير المهنة والخروج والعودة، وتذكرة عودة العامل بعد انتهاء العلاقة، ونقل الجثمان. ويتحمل العامل تذكرة عودته إذا لم يكن صالحًا للعمل أو رغب العودة دون سبب مشروع.
41|لائحة الاستقدام|تحدد اللائحة شروط الاستقدام ونقل الخدمات وتغيير المهنة وإجراءاتها.
#training
42|سياسة التدريب|على كل صاحب عمل وضع سياسة لتدريب عماله السعوديين وتأهيلهم.
43|نسبة التدريب|يدرب صاحب العمل نسبة من عماله السعوديين يحددها الوزير، وتُحتسب منها من يكمل دراسته على حساب صاحب العمل.
44|برنامج التدريب|يتضمن البرنامج المهارة والمدة والساعات والجانبين النظري والعملي وطريقة الاختبار والشهادات.
45|عقد التأهيل والتدريب|عقد يتعهد فيه صاحب العمل بتأهيل شخص أو تدريبه لمهنة محددة.
46|بيانات عقد التدريب|يكون مكتوبًا ويحدد المهنة والمدة والمراحل ومكافأة كل مرحلة، ولا تُربط المكافأة بالقطعة أو الإنتاج.
47|تدريب الطلاب والخريجين|للوزير إلزام المنشآت بقبول نسبة من طلاب الجامعات والكليات وخريجيها للتدريب بعقد تدريب، ويجوز منح مكافأة.
48|إنهاء عقد التدريب والعمل بعده|لكل طرف إنهاء العقد بإشعار قبل أسبوع على الأقل. ولصاحب العمل إلزام المتدرب بالعمل لديه مدة تساوي مدة التدريب، فإن رفض لزمه دفع تكاليف التدريب أو ما يقابل المدة المتبقية.
49|الأحكام المطبقة على المتدرب|تسري على عقد التدريب أحكام الإجازات والعطلات وساعات العمل والراحة والسلامة وإصابات العمل.
#rel
50|عقد العمل|عقد بين صاحب العمل والعامل يتعهد فيه العامل بالعمل تحت إدارته أو إشرافه مقابل أجر.
51|كتابة العقد|يُكتب العقد من نسختين لكل طرف نسخة، ويُعد قائمًا ولو لم يُكتب، وللعامل وحده إثباته بكل طرق الإثبات.
52|بيانات العقد|تضع الوزارة نموذجًا موحدًا يشمل بيانات الطرفين والأجر والبدلات ونوع العمل ومكانه وتاريخ الالتحاق والمدة، ويجوز إضافة بنود لا تخالف النظام.
53|فترة التجربة|يجب النص على فترة التجربة صراحة في العقد وتحديد مدتها، ولا يزيد مجموعها في جميع الأحوال على 180 يومًا (تعديل 2025). لا تدخل فيها إجازتا العيدين واليوم الوطني ويوم التأسيس والإجازات المرضية. لكل طرف إنهاء العقد خلالها.
54|عدم تكرار التجربة|لا يوضع العامل تحت التجربة أكثر من مرة عند صاحب عمل واحد، إلا باتفاق مكتوب لمهنة أخرى أو بعد 6 أشهر من انتهاء العلاقة. وإذا انتهى العقد خلال التجربة فلا تعويض لأي طرف ولا مكافأة نهاية خدمة.
55|العقد محدد المدة وتجديده|ينتهي بانقضاء مدته، وإذا استمر الطرفان في تنفيذه عُد غير محدد المدة (مع مراعاة م37 لغير السعودي). وإذا تضمن شرط تجديد يتجدد للمدة المتفق عليها، ويصبح غير محدد المدة إذا تجدد 3 مرات متتالية أو بلغت مدته مع التجديد 4 سنوات، أيهما أقل.
56|احتساب مدة التجديد|مدة التجديد امتداد للمدة الأصلية في حساب الحقوق المرتبطة بمدة الخدمة.
57|عقد العمل المعين|ينتهي العقد المبرم لعمل معين بإنجاز ذلك العمل.
58|النقل إلى مكان آخر|لا يُنقل العامل إلى مكان يقتضي تغيير إقامته دون موافقته الكتابية، ويجوز للضرورة العارضة تكليفه في مكان آخر حتى 30 يومًا في السنة على نفقة صاحب العمل.
59|تغيير نوع الأجر|لا يُنقل صاحب الأجر الشهري إلى الأجر اليومي أو الأسبوعي أو بالقطعة أو بالساعة إلا بموافقته الكتابية.
60|تغيير طبيعة العمل|لا يُكلف العامل بعمل يختلف جوهريًا عن المتفق عليه دون موافقته الكتابية، إلا للضرورة العارضة حتى 30 يومًا في السنة.
61|واجبات صاحب العمل|عدم السخرة، وعدم حجز الأجر دون سند قضائي، والمعاملة باحترام، ومنح الوقت لممارسة الحقوق، ومنع التمييز في التوظيف، وتوفير السكن والنقل أو بدلهما النقدي (تعديل 2025).
62|أجر التعطل بسبب صاحب العمل|يستحق العامل أجره إذا حضر أو أبدى استعداده للعمل ومنعه سبب يرجع لصاحب العمل.
63|منع المواد المحرمة|يمنع صاحب العمل دخول المواد المحرمة شرعًا إلى أماكن العمل.
64|شهادة الخدمة|يعطي صاحب العمل العامل عند انتهاء العقد شهادة خدمة مجانية بتاريخ التحاقه وانتهاء خدمته ومهنته وآخر أجر، ويعيد له وثائقه.
65|واجبات العامل|إنجاز العمل وفق أصول المهنة والتعليمات المشروعة، والعناية بالأدوات، وحسن السلوك، والمساعدة في الكوارث، والخضوع للفحص الطبي، وحفظ أسرار العمل.
66|الجزاءات التأديبية|الجزاءات المسموحة: الإنذار، الغرامة، الحرمان من العلاوة أو تأجيلها حتى سنة، تأجيل الترقية حتى سنة، الإيقاف عن العمل مع الحرمان من الأجر، والفصل في الحالات المقررة نظامًا.
67|حصر الجزاءات|لا يوقع صاحب العمل جزاءً غير وارد في النظام أو لائحة تنظيم العمل.
68|تشديد الجزاء|لا يشدد الجزاء للتكرار إذا مضى 180 يومًا على إبلاغ العامل بجزاء المخالفة السابقة.
69|مدد الاتهام|لا يُتهم العامل بمخالفة مضى على كشفها أكثر من 30 يومًا، ولا يوقع الجزاء بعد أكثر من 30 يومًا من انتهاء التحقيق.
70|حدود الغرامة والإيقاف|لا تتجاوز الغرامة عن المخالفة الواحدة أجر 5 أيام، ولا يُقتطع للغرامات أكثر من أجر 5 أيام في الشهر، ولا يزيد الإيقاف دون أجر على 5 أيام في الشهر، ولا جزاء على فعل خارج العمل ما لم يتصل به.
71|التحقيق قبل الجزاء|لا يُوقع جزاء إلا بعد إبلاغ العامل كتابة بالمخالفة وسماع دفاعه وإثبات ذلك في محضر. ويجوز الاستجواب شفهيًا في المخالفات البسيطة التي لا تتجاوز الإنذار أو غرامة يوم.
72|التبليغ والتظلم من الجزاء|يُبلغ العامل بالجزاء كتابيًا، وله التظلم داخليًا خلال 30 يومًا، فإذا رُفض أو لم يُرد عليه خلال 15 يومًا فله الاعتراض أمام المحكمة العمالية خلال 30 يومًا (تعديل 2025).
73|سجل الغرامات|تُسجل الغرامات في سجل خاص، ولا تُصرف إلا لمصلحة عمال المنشأة بموافقة الوزارة.
74|حالات انتهاء العقد|ينتهي العقد باتفاق الطرفين بموافقة العامل الكتابية، أو انتهاء مدته، أو إرادة أحد الطرفين في العقد غير محدد المدة، أو الاستقالة (أضيفت 2025)، أو بلوغ سن التقاعد، أو القوة القاهرة، أو إغلاق المنشأة نهائيًا، أو إنهاء النشاط، أو حكم نهائي بإنهاء العقد ضمن إجراءات الإفلاس (أضيف 2025).
75|مدة الإشعار (العقد غير محدد المدة)|يجوز لأي طرف إنهاء العقد غير محدد المدة لسبب مشروع بإشعار كتابي. لصاحب الأجر الشهري: إشعار من العامل قبل 30 يومًا، ومن صاحب العمل قبل 60 يومًا (تعديل 2025). ولغير صاحب الأجر الشهري: 30 يومًا لكل طرف.
76|التعويض عن عدم الإشعار|إذا لم يراعِ الطرف المنهي مدة الإشعار التزم بدفع أجر العامل عن مدة الإشعار أو المتبقي منها، ما لم يتفقا على أكثر.
77|التعويض عن الإنهاء لسبب غير مشروع|ما لم يتضمن العقد تعويضًا محددًا، يستحق المتضرر: في العقد غير محدد المدة أجر 15 يومًا عن كل سنة خدمة، وفي العقد محدد المدة أجر المدة الباقية. ولا يقل التعويض في جميع الأحوال عن أجر شهرين.
78|التغيب خلال الإشعار|إذا كان الإشعار من صاحب العمل فللعامل التغيب يومًا كاملًا أو 8 ساعات أسبوعيًا للبحث عن عمل بأجر كامل. ولصاحب العمل إعفاؤه من العمل خلال الإشعار مع احتساب خدمته وأجره حتى نهايته.
79|الوفاة والعجز|لا ينتهي العقد بوفاة صاحب العمل ما لم تكن شخصيته محل اعتبار، وينتهي بوفاة العامل أو عجزه عن العمل بشهادة طبية معتمدة.
79 مكرر|الاستقالة|تُعد الاستقالة مقبولة بعد 30 يومًا دون رد، ولصاحب العمل تأجيل قبولها حتى 60 يومًا بخطاب مسبب قبل انتهاء الثلاثين. للعامل العدول خلال 7 أيام ما لم تُقبل، ولا يجوز تحديد تاريخ مؤجل للاستقالة، ويبقى العقد ساريًا خلال مدتها، ويحتفظ العامل بكل حقوقه (أضيفت 2025).
80|الفسخ دون مكافأة أو إشعار أو تعويض|لا يجوز لصاحب العمل الفسخ دون مكافأة أو إشعار أو تعويض إلا في حالات محددة، بشرط إتاحة الفرصة للعامل لإبداء أسباب معارضته: (1) الاعتداء على صاحب العمل أو المدير أو أحد الرؤساء أو المرؤوسين أثناء العمل أو بسببه. (2) عدم أداء الالتزامات الجوهرية أو عدم إطاعة الأوامر المشروعة أو عدم مراعاة تعليمات السلامة المعلنة رغم إنذاره كتابيًا. (3) ثبوت سوء السلوك أو الإخلال بالشرف أو الأمانة. (4) فعل أو تقصير متعمد لإلحاق خسارة مادية بشرط إبلاغ الجهات المختصة خلال 24 ساعة من العلم. (5) ثبوت التزوير للحصول على العمل. (6) إذا كان معينًا تحت الاختبار. (7) الغياب دون سبب مشروع أكثر من 30 يومًا خلال سنة عقدية واحدة أو أكثر من 15 يومًا متتالية، بشرط إنذار كتابي بعد 20 يومًا في الحالة الأولى أو 10 أيام متتالية في الثانية. (8) ثبوت استغلال المركز الوظيفي بطريقة غير مشروعة. (9) ثبوت إفشاء الأسرار الصناعية أو التجارية.
81|ترك العامل للعمل مع حفظ حقوقه|يحق للعامل ترك العمل دون إشعار مع احتفاظه بكامل حقوقه إذا: أخل صاحب العمل بالتزاماته الجوهرية، أو غشه وقت التعاقد، أو كلفه بعمل مختلف جوهريًا دون موافقته، أو اعتدى عليه أو أساء له أو لأسرته، أو عامله بقسوة أو إهانة، أو وُجد خطر جسيم يعلمه صاحب العمل ولم يعالجه، أو دفعته تصرفات صاحب العمل لأن يظهر هو المنهي للعقد.
82|الإنهاء بسبب المرض|لا يجوز إنهاء خدمة العامل بسبب المرض قبل استنفاد مدد الإجازة المرضية النظامية، وللعامل طلب ضم إجازته السنوية إلى المرضية.
83|عدم المنافسة وعدم الإفشاء|يجوز اشتراط عدم المنافسة أو عدم إفشاء الأسرار بعد انتهاء العقد بشرط أن يكون مكتوبًا ومحددًا زمانًا ومكانًا ونوع عمل، ولا تزيد مدته على سنتين، وترفع الدعوى خلال سنة من اكتشاف المخالفة.
84|مكافأة نهاية الخدمة|عند انتهاء العلاقة يدفع صاحب العمل مكافأة: أجر نصف شهر عن كل سنة من السنوات الخمس الأولى، وأجر شهر عن كل سنة بعدها. يُتخذ الأجر الأخير أساسًا للحساب، وتستحق عن أجزاء السنة بنسبة ما قضاه منها.
85|مكافأة الاستقالة|عند الاستقالة يستحق: ثلث المكافأة إذا كانت خدمته من سنتين إلى 5 سنوات، وثلثيها إذا زادت على 5 سنوات ولم تبلغ 10، وكاملة إذا بلغت 10 سنوات فأكثر. وأقل من سنتين لا يستحق مكافأة.
86|استبعاد العمولات|يجوز الاتفاق على استبعاد العمولات والنسب المتغيرة من الأجر الذي تُحسب عليه المكافأة.
87|المكافأة كاملة رغم الاستقالة|تستحق المكافأة كاملة إذا ترك العامل العمل لقوة قاهرة خارجة عن إرادته، أو إذا أنهت العاملة العقد خلال 6 أشهر من الزواج أو 3 أشهر من الوضع.
88|مهلة تصفية الحقوق|يدفع صاحب العمل الأجر ويصفي الحقوق خلال أسبوع إذا انتهت الخدمة من جهته، وخلال أسبوعين إذا كان العامل هو المنهي. ولصاحب العمل حسم ديونه المستحقة بسبب العمل.
#cond
89|الحد الأدنى للأجور|لمجلس الوزراء عند الحاجة تحديد حد أدنى للأجور باقتراح من الوزير.
90|صرف الأجور|تُدفع الأجور بالعملة الرسمية عبر البنوك: اليومية أسبوعيًا على الأقل، والشهرية مرة في الشهر، والعمل بالقطعة الذي يتجاوز أسبوعين على دفعات أسبوعية.
91|خصم قيمة التلف|يجوز خصم تكلفة إصلاح ما أتلفه العامل بخطئه بحد أقصى أجر 5 أيام شهريًا، وله التظلم أمام المحكمة العمالية.
92|الحسم من الأجر|لا يُحسم دون موافقة كتابية إلا في حالات محددة: قروض صاحب العمل بحد 10% من الأجر، والاشتراكات، والغرامات، وتنفيذ الأحكام بحد 25% من الأجر شهريًا، ويُقدم دين النفقة.
93|سقف الحسم|لا تزيد الحسومات في جميع الأحوال على نصف أجر العامل، ما لم تأذن المحكمة العمالية بأكثر، وإذا ثبتت حاجة العامل لأكثر من نصف أجره فلا يُعطى أكثر من ثلاثة أرباعه.
94|الحسم أو التأخير غير المشروع|للعامل طلب استرداد الحسم غير المشروع أو صرف الأجور المتأخرة، وللمحكمة فرض غرامة على صاحب العمل لا تتجاوز ضعف المبلغ.
95|تحديد الأجر عند عدم النص|إذا لم يُحدد الأجر يُعتمد أجر العمل المماثل في المنشأة، ثم عرف المهنة، ثم تقدير المحكمة العمالية.
96|متوسط أجر القطعة والعمولة|يُحسب متوسط الأجر عن أيام العمل الفعلية في السنة الأخيرة لمن يعمل بالقطعة أو العمولة.
97|التوقيف في قضية عمل|يصرف صاحب العمل 50% من الأجر للعامل الموقوف في قضية متصلة بالعمل حتى 180 يومًا، ويُرد له الباقي إذا بُرئ.
98|ساعات العمل|لا تزيد ساعات العمل الفعلية على 8 ساعات يوميًا أو 48 ساعة أسبوعيًا، وفي رمضان للمسلمين 6 ساعات يوميًا أو 36 أسبوعيًا.
99|تعديل الساعات لبعض الفئات|يجوز للوزير رفعها إلى 9 ساعات يوميًا لبعض الفئات، أو خفضها إلى 7 ساعات للأعمال الخطرة.
100|العمل بالمناوبة|يجوز بموافقة الوزارة زيادة الساعات في الأعمال المستمرة بشرط ألا يزيد المتوسط خلال 3 أسابيع على 8 ساعات يوميًا أو 48 أسبوعيًا.
101|فترات الراحة|لا يعمل العامل أكثر من 5 ساعات متتالية دون راحة لا تقل عن نصف ساعة، ولا يبقى في مكان العمل أكثر من 12 ساعة في اليوم.
102|الراحة خارج ساعات العمل|لا تُحسب فترات الراحة والصلاة والطعام من ساعات العمل، ولا يكون العامل خلالها تحت سلطة صاحب العمل.
103|العمل دون راحة|يحدد الوزير الحالات التي يستمر فيها العمل دون راحة، مع تنظيم وقت للصلاة والطعام داخل المنشأة.
104|الراحة الأسبوعية|الجمعة يوم الراحة الأسبوعية بأجر كامل ولا تقل عن 24 ساعة متتالية، ويجوز استبداله بيوم آخر بعد إبلاغ مكتب العمل، ولا يُعوض نقدًا.
105|تجميع الراحات|يجوز في الأماكن النائية تجميع الراحات الأسبوعية حتى 8 أسابيع باتفاق الطرفين وموافقة الوزارة.
106|تجاوز الساعات للضرورة|يجوز تجاوز الساعات في الجرد السنوي (حتى 30 يومًا في السنة) ومنع الحوادث وضغط العمل والمواسم، بشرط ألا تزيد على 10 ساعات يوميًا أو 60 أسبوعيًا.
107|العمل الإضافي|يدفع عن الساعة الإضافية أجر الساعة مضافًا إليه 50% من الأجر الأساسي، ويجوز باتفاق العامل منحه إجازة تعويضية مدفوعة بدلًا من الأجر (تعديل 2025).
108|استثناءات الساعات|لا تسري أحكام م98 وم101 على المناصب الإدارية العليا والأعمال التحضيرية والمتقطعة وعمال الحراسة والنظافة عدا الحراسة الأمنية المدنية.
109|الإجازة السنوية|إجازة سنوية لا تقل عن 21 يومًا تزاد إلى 30 يومًا إذا أمضى 5 سنوات متصلة، بأجر يُدفع مقدمًا، ويُشعر بموعدها قبل 30 يومًا، ولا يجوز النزول عنها مقابل بدل نقدي أثناء الخدمة.
110|تأجيل الإجازة|للعامل بموافقة صاحب العمل ترحيل إجازته للسنة التالية، ولصاحب العمل تأجيلها حتى 90 يومًا لظروف العمل، وما زاد يحتاج موافقة العامل كتابيًا ولا يتجاوز نهاية السنة التالية.
111|التعويض عن رصيد الإجازات|يستحق العامل عند ترك العمل أجر أيام الإجازة المستحقة التي لم يحصل عليها، وأجزاء السنة بنسبة ما قضاه.
112|إجازات الأعياد والمناسبات|للعامل إجازة بأجر كامل في الأعياد والمناسبات التي تحددها اللائحة.
113|إجازات المناسبات|5 أيام بأجر كامل للزواج أو وفاة الزوج أو أحد الأصول أو الفروع، و3 أيام لوفاة الأخ أو الأخت، و3 أيام لولادة مولود تُستخدم خلال 7 أيام من الولادة (تعديل 2025).
114|إجازة الحج|إجازة بأجر من 10 إلى 15 يومًا شاملة عيد الأضحى مرة واحدة طوال الخدمة لمن أمضى سنتين متصلتين على الأقل.
115|إجازة الامتحانات|إجازة بأجر لأيام امتحان السنة غير المعادة إذا وافق صاحب العمل على الدراسة، وبدون أجر للسنة المعادة، وتُطلب قبل 15 يومًا.
116|الإجازة بدون أجر|يجوز باتفاق الطرفين، ويُعد العقد موقوفًا فيما زاد على 20 يومًا ما لم يُتفق على غير ذلك.
117|الإجازة المرضية|خلال السنة الواحدة من أول إجازة مرضية: 30 يومًا بأجر كامل، ثم 60 يومًا بثلاثة أرباع الأجر، ثم 30 يومًا بدون أجر، متصلة أو متقطعة.
118|العمل لدى الغير أثناء الإجازة|لا يجوز للعامل العمل لدى صاحب عمل آخر خلال إجازته، وإذا ثبت ذلك جاز حرمانه من أجرها أو استرداده.
#part
119|التخفيض المؤقت للساعات|التخفيض الجماعي المؤقت لساعات العمل لأسباب اقتصادية أو تقنية لا يجعل العاملين طوال الوقت عاملين لبعض الوقت.
120|تنظيم العمل لبعض الوقت|يصدر الوزير ضوابط العمل لبعض الوقت والتزامات الطرفين، مع بقاء حمايتهم في السلامة وإصابات العمل.
#safety
121|نظافة المنشأة|يُبقي صاحب العمل المنشأة نظيفة وصحية ويوفر الإنارة ومياه الشرب والاغتسال.
122|احتياطات السلامة|يتخذ صاحب العمل احتياطات حماية العمال من الأخطار والأمراض والآلات، ويعلن تعليمات السلامة، ولا يحمل العمال تكلفتها.
123|إعلام العامل بالمخاطر|يُبلغ العامل قبل بدء العمل بمخاطر مهنته ويُزود بأدوات الوقاية ويُدرب عليها.
124|التزام العامل بالوقاية|يستخدم العامل وسائل الوقاية ويحافظ عليها وينفذ تعليمات السلامة.
125|الوقاية من الحريق|يتخذ صاحب العمل احتياطات الحريق ويهيئ وسائل المكافحة ومنافذ النجاة ويعلق التعليمات.
126|الحوادث لغير العمال|يتحمل صاحب العمل الحوادث التي تصيب الغير داخل مكان العمل إذا وقعت بسبب إهمال الاحتياطات.
127|نطاق المخاطر الكبرى|تسري أحكام هذا الفصل على المنشآت ذات المخاطر الكبرى.
128|تعريفات المخاطر الكبرى|يعرّف المنشأة ذات المخاطر الكبرى والمادة الخطرة والحادث الكبير.
129|ضوابط تحديد المنشآت|تضع الوزارة ضوابط تحديد المنشآت ذات المخاطر الكبرى بناءً على قوائم المواد الخطرة.
130|تحديد وضع المنشأة|يحدد صاحب العمل وضع منشأته بالتنسيق مع الوزارة وفق الضوابط.
131|لوائح المخاطر الكبرى|يصدر الوزير لوائح الوقاية من الحوادث الكبرى وحماية الجمهور والبيئة.
131 مكرر|المهن الخطرة|يحدد الوزير المهن الخطرة أو الضارة والفئات المحظور تشغيلها فيها وشروط ذلك.
132|نطاق إصابات العمل|لا تسري أحكام هذا الفصل على المنشآت المشمولة بفرع الأخطار المهنية في التأمينات الاجتماعية.
133|علاج الإصابة|يلتزم صاحب العمل بعلاج المصاب ونفقاته كاملة من إقامة وفحوص وأجهزة تعويضية وانتقال.
134|تعريف إصابة العمل|تُعرّف وفق نظام التأمينات الاجتماعية، والأمراض المهنية في حكمها، وتاريخ أول مشاهدة طبية هو تاريخ الإصابة.
135|الانتكاس والمضاعفات|الانتكاس أو المضاعفات الناشئة عن الإصابة في حكم الإصابة.
136|جداول الأمراض والعجز|تُحدد الأمراض المهنية ونسب العجز وفق جداول نظام التأمينات الاجتماعية.

  return isEffectivelyIndefinite(e) ? Math.max(60, c) : c;
}
function noticeWarnings(e) {
  const w = [], c = num(e.noticeDays);
  if (isEffectivelyIndefinite(e)) {
    if (e.noticeClause === "yes" && c && c < 60) w.push(`مدة الإشعار في العقد ${c} يومًا وهي أقل من الحد النظامي، فتُطبّق 60 يومًا على صاحب العمل (م75).`);
    if (e.noticeClause === "no") w.push("العقد لا ينص على فترة إشعار، فتُطبّق المدة النظامية: 60 يومًا على صاحب العمل و30 يومًا على العامل (م75).");
  } else {
    if (e.noticeClause === "yes") w.push(`العقد محدد المدة وينص على إشعار ${c ? c + " يومًا" : "(المدة غير مدخلة)"}: التزم به عند الإنهاء أو عدم التجديد.`);
    if (e.noticeClause === "no") w.push("العقد محدد المدة ولا ينص على إشعار: ينتهي بانتهاء مدته، والإنهاء قبلها خارج المادة 80 يستحق أجر المدة الباقية (م77).");
  }
  return w;
}

/* Settlement for one exit path. kind: art80 | valid | noreason | mutual | probation | contract_end | wait_end | resign | art81 | death */
function settle(e, kind, endDate, o = {}) {
  const w = monthlyWage(e), d = w / 30, y = serviceYears(e, endDate);
  const indefinite = isEffectivelyIndefinite(e);
  const items = [], notes = [];
  const add = (label, amount, basis, art) => items.push({ label, amount: Math.round(amount), basis, art });
  const full = eosbFull(w, y);
  const eosbBasis = `${y.toFixed(2)} سنة × الأجر الأخير ${fmt(w)} (نصف شهر لأول 5 سنوات وشهر لما بعدها)`;

  if (["valid", "noreason", "mutual", "contract_end", "wait_end", "art81", "death"].includes(kind)) add("مكافأة نهاية الخدمة", full, eosbBasis, "84");
  if (kind === "resign") {
    const f = o.art87 ? 1 : resignFraction(y);
    const fl = f === 1 ? "كاملة" : f === 0 ? "لا يستحق (أقل من سنتين)" : f > 0.5 ? "الثلثان" : "الثلث";
    add("مكافأة نهاية الخدمة (استقالة)", full * f, `${fl} من ${fmt(full)}`, o.art87 ? "87" : "85");
    if (!indefinite && e.contractEnd && endDate < e.contractEnd) notes.push("الاستقالة قبل نهاية عقد محدد المدة: قد يطالب صاحب العمل بتعويض وفق المادة 77 إذا لم يكن لها سبب مشروع. يحتاج مراجعة.");
  }
  if (kind === "art80" || kind === "probation") add("مكافأة نهاية الخدمة", 0, kind === "art80" ? "لا تستحق في حالات المادة 80" : "لا تستحق عن مدة التجربة", kind === "art80" ? "80" : "54");

  const nd = noticeDays(e);
  if (!o.noticeServed && nd > 0 && (kind === "valid" || (kind === "noreason" && indefinite)))
    add("بدل الإشعار", nd * d, `${nd} يومًا × الأجر اليومي (${indefinite ? (nd > 60 ? "حسب العقد" : "الحد النظامي لإشعار صاحب العمل") : "حسب بند الإشعار في العقد"})`, "75، 76");
  if (kind === "noreason" || kind === "art81") {
    let comp, basis, stat, statBasis;
    if (indefinite) { stat = 15 * d * y; statBasis = `15 يومًا × ${y.toFixed(2)} سنة`; }
    else { const rem = e.contractEnd ? Math.max(0, dDiff(endDate, e.contractEnd)) : 0; stat = rem * d; statBasis = `أجر المدة الباقية (${rem} يومًا)`; }
    if (num(o.agreedComp) > 0) { comp = num(o.agreedComp); basis = `تعويض محدد في العقد ${fmt(comp)}${comp < stat ? ` (الحساب النظامي بدونه ${fmt(stat)})` : ""}`; }
    else { comp = stat; basis = statBasis; }
    // Art 77: "in all cases" not less than two months' wage, including a contract amount
    if (comp < 2 * w) { comp = 2 * w; basis += `، ورُفع للحد الأدنى في م77: أجر شهرين (${fmt(2 * w)})`; }
    add(kind === "art81" ? "تعويض محتمل للعامل" : "تعويض الإنهاء لسبب غير مشروع", comp, basis, "77");
  }
  if (kind === "wait_end" && e.contractEnd) {
    const rem = Math.max(0, dDiff(todayISO(), e.contractEnd));
    add("رواتب حتى نهاية العقد", rem * d, `${rem} يومًا × الأجر اليومي (تكلفة تشغيل وليست تعويضًا)`, "55");
  }
  if (num(e.leaveBalance) > 0) add("رصيد الإجازات", num(e.leaveBalance) * d, `${Math.round(num(e.leaveBalance) * 10) / 10} يومًا × ${fmt(d)}`, "111");
  if (num(o.unpaidDays) > 0) add("أجور مستحقة لم تُصرف", num(o.unpaidDays) * d, `${num(o.unpaidDays)} يومًا`, "88");
  const ntc = items.find(i => i.label === "بدل الإشعار");
  if (kind === "noreason" && ntc) notes.push(`بدل الإشعار (م76) مع تعويض م77: الغالب في الأحكام المنشورة والشروح أنهما يُجمعان لأن لكل منهما سببًا مستقلًا (مثال: حكم استئناف الرياض المنشور في عكاظ 2024 جمع بدل الإشعار مع تعويض المدة الباقية). لكن فيه رأي مخالف وبعض الدوائر لا تجمع، ولا يوجد مبدأ قضائي ملزم منشور. أسوأ احتمال لصاحب العمل محسوب أعلاه، وبدون بدل الإشعار يصير الإجمالي ${fmt(items.reduce((s, i) => s + i.amount, 0) - ntc.amount)}.`);
  if (kind === "mutual") notes.push("أي مبلغ إضافي في التسوية يكون بالتفاوض، والمخالصة الموقعة تقلل خطر النزاع.");
  const total = items.reduce((s, i) => s + i.amount, 0);
  return { items, total, notes, wage: w, years: y, indefinite };
}

/* Compare employer exit options for a termination request */
function assessTermination(e, c) {
  const end = c.endDate || todayISO();
  const ev = c.evidence || {}, f = c.flags || {};
  const reason = c.reason || "none";
  const need = REASON_EVIDENCE[reason] || [];
  const have = need.filter(k => ev[k]), lack = need.filter(k => !ev[k]);
  const indefinite = isEffectivelyIndefinite(e);
  const opts = [];
  const o = { noticeServed: f.noticeServed, agreedComp: f.agreedComp, unpaidDays: f.unpaidDays };
  const blocked = !!f.pregnant || e.pregnant === "yes";
  const warnings = [];
  if (blocked) warnings.push("الموظفة حامل أو في إجازة وضع أو مرض ناشئ عنهما: لا يجوز فصلها أو إنذارها بالفصل (م155).");
  const md = missingData(e);
  if (md.length) warnings.push("بيانات ناقصة تؤثر على الحساب: " + md.join("، ") + ".");
  if (e.contractType === "fixed" && indefinite) warnings.push("العقد محدد المدة لكنه تجدد 3 مرات أو بلغ 4 سنوات، فيُعامل كغير محدد المدة (م55).");
  warnings.push(...noticeWarnings(e));
  const nd = noticeDays(e);

  // 1. Probation
  if (inProbation(e, end)) {
    opts.push({ key: "probation", label: "إنهاء خلال فترة التجربة", status: blocked ? "no" : "ok", risk: blocked ? "high" : "low",
      why: [`فترة التجربة تنتهي ${probationEnd(e)}، وتاريخ الإنهاء قبلها.`, "تأكد أن فترة التجربة منصوص عليها صراحة في العقد."],
      need: ["نص فترة التجربة في العقد"], arts: ["53", "54", "80"], calc: settle(e, "probation", end, o) });
  }
  // 2. Art 80
  const para = ART80_PARA[reason];
  if (para) {
    let ok = lack.length === 0, why = [`السبب يقابل الفقرة (${para}) من المادة 80.`];
    if (reason === "absence") {
      const a = num(f.absYear), b = num(f.absConsec);
      const meets = a > 30 || b > 15;
      why.push(meets ? `الغياب (${a} يومًا في السنة، ${b} متتالية) يتجاوز الحد النظامي.` : `الغياب المدخل (${a} في السنة، ${b} متتالية) لا يتجاوز 30 يومًا في السنة ولا 15 متتالية.`);
      ok = ok && meets;
    }
    if (lack.length) why.push("مستندات ناقصة: " + lack.map(k => EVIDENCE[k]).join("، ") + ".");
    why.push("يشترط إتاحة الفرصة للموظف لإبداء أسباب معارضته قبل القرار.");
    opts.push({ key: "art80", label: "فصل دون مكافأة وفق المادة 80", status: blocked ? "no" : ok ? "cond" : "no", risk: blocked ? "high" : ok ? "med" : "high",
      why, need: need.map(k => EVIDENCE[k]), arts: ["80", "72"], calc: settle(e, "art80", end, o) });
  } else if (reason !== "none") {
    opts.push({ key: "art80", label: "فصل دون مكافأة وفق المادة 80", status: "no", risk: "high",
      why: [`"${REASONS[reason]}" ليس من الحالات المحددة في المادة 80. الفصل بهذا المسار غالبًا يُعد إنهاءً لسبب غير مشروع.`],
      need: [], arts: ["80", "77"], calc: settle(e, "art80", end, o) });
  }
  // 3. Valid reason with notice + EOSB
  if (reason !== "none") {
    const ratio = need.length ? have.length / need.length : 0;
    let risk = ratio === 1 ? "low" : ratio >= 0.5 ? "med" : "high", why = [];
    if (reason === "restructuring") { risk = ev.restructure_docs ? "med" : "high"; why.push("إلغاء الوظيفة يحتاج إثبات أنه حقيقي وليس ذريعة، والتقدير فيه للمحكمة العمالية. يحتاج مراجعة قانونية."); }
    why.push(have.length ? "متوفر: " + have.map(k => EVIDENCE[k]).join("، ") + "." : "لا توجد مستندات تثبت السبب حاليًا.");
    if (lack.length) why.push("ناقص: " + lack.map(k => EVIDENCE[k]).join("، ") + ".");
    if (!indefinite) { risk = "high"; why.push("العقد محدد المدة: إنهاؤه قبل نهايته خارج حالات المادة 80 قد يُعد بدون سبب مشروع ويستحق أجر المدة الباقية (م77)."); }
    if (nd > 0 && !f.noticeServed) why.push(`لم يُسلَّم إشعار: إما إشعار كتابي ${nd} يومًا أو دفع بدله.`);
    opts.push({ key: "valid", label: "إنهاء لسبب مشروع مع الإشعار والمكافأة", status: blocked ? "no" : "cond", risk: blocked ? "high" : risk,
      why, need: need.map(k => EVIDENCE[k]).concat(nd > 0 ? [`إشعار كتابي قبل ${nd} يومًا`] : []), arts: ["74", "75", "76", "84"], calc: settle(e, "valid", end, o) });
  }
  // 4. No valid reason (pay compensation)
  opts.push({ key: "noreason", label: "إنهاء مع دفع التعويض النظامي", status: blocked ? "no" : "ok", risk: blocked ? "high" : "low",
    why: ["أوضح مسار نظاميًا: تدفع المكافأة والإشعار وتعويض المادة 77 فيقل خطر الدعوى.", "التكلفة أعلى من بقية المسارات."],
    need: ["خطاب إنهاء", "مخالصة نهائية موقعة"], arts: ["77", "76", "84", "88"], calc: settle(e, "noreason", end, o) });
  // 5. Mutual
  opts.push({ key: "mutual", label: "إنهاء بالاتفاق (تسوية ودية)", status: blocked ? "cond" : "cond", risk: "low",
    why: ["يحتاج موافقة الموظف كتابيًا.", "الحد الأدنى المتوقع: المكافأة كاملة ورصيد الإجازات، وما زاد بالتفاوض."],
    need: ["اتفاقية إنهاء موقعة", "مخالصة نهائية"], arts: ["74", "84"], calc: settle(e, "mutual", end, o) });
  // 6. Wait for fixed-term end
  if (!indefinite && e.contractEnd && e.contractEnd >= todayISO()) {
    const rem = dDiff(todayISO(), e.contractEnd);
    opts.push({ key: "wait_end", label: "عدم التجديد عند نهاية العقد", status: blocked ? "cond" : "ok", risk: rem <= 120 ? "low" : "med",
      why: [`العقد ينتهي ${e.contractEnd} (بعد ${rem} يومًا).`, e.noticeClause === "yes" ? `العقد ينص على إشعار${num(e.noticeDays) ? " " + num(e.noticeDays) + " يومًا" : ""}: سلّم خطاب عدم التجديد قبل هذه المدة.` : e.noticeClause === "no" ? "العقد لا ينص على إشعار بعدم التجديد، ويُفضّل إبلاغه كتابيًا مبكرًا." : "حدد في ملف الموظف هل العقد ينص على فترة إشعار."],
      need: ["خطاب عدم تجديد حسب مدة العقد"], arts: ["55", "84"], calc: settle(e, "wait_end", e.contractEnd, o) });
  }

  const rank = { low: 0, med: 1, high: 2 };
  const feasible = opts.filter(x => x.status !== "no");
  feasible.sort((a, b) => rank[a.risk] - rank[b.risk] || a.calc.total - b.calc.total);
  const rec = blocked ? null : feasible[0] || null;
  const fb = rec && rec.status !== "ok" ? feasible.find(x => x !== rec && x.status === "ok") : null;
  return { options: opts, recommended: rec ? rec.key : null, fallback: fb ? fb.key : null, warnings, missingEvidence: lack.map(k => EVIDENCE[k]) };
}

/* Non-termination case kinds: one breakdown */
function assessSimple(e, c) {
  const kindMap = { resign: "resign", contract_end: "contract_end", art81: "art81", death: "death" };
  const k = kindMap[c.type];
  const calc = settle(e, k, c.endDate || todayISO(), { art87: c.flags?.art87, unpaidDays: c.flags?.unpaidDays });
  const arts = { resign: ["79 مكرر", "85", "87", "88", "111"], contract_end: ["55", "84", "111"], art81: ["81", "77", "84"], death: ["79", "84", "111"] }[k];
  const warnings = [];
  const md = missingData(e); if (md.length) warnings.push("بيانات ناقصة: " + md.join("، ") + ".");
  if (k === "resign" || k === "contract_end") warnings.push(...noticeWarnings(e));
  if (k === "art81") warnings.push("إذا ثبتت حالة من حالات المادة 81 يستحق الموظف كامل حقوقه، وقد يُحكم له بتعويض. راجع الوقائع قبل الرد.");
  if (k === "resign") warnings.push("الاستقالة تُعد مقبولة بعد 30 يومًا دون رد، ولك تأجيلها حتى 60 يومًا بخطاب مسبب (م79 مكرر). المستحقات تُصفّى خلال أسبوعين (م88).");
  return { calc, arts, warnings };
}

function employeeAlerts(e, today) {
  const a = [];
  if (e.contractType === "fixed" && e.contractEnd) {
    const r = dDiff(today, e.contractEnd);
    const nd = e.noticeClause === "yes" ? num(e.noticeDays) : 0;
    if (r >= 0 && nd > 0) {
      const dl = addDays(e.contractEnd, -nd), left = dDiff(today, dl);
      if (left >= 0 && left <= 30) a.push({ lvl: left <= 7 ? "bad" : "warn", t: `آخر موعد لإشعار عدم التجديد ${dl} (بعد ${left} يومًا). العقد ينتهي ${e.contractEnd} وينص على إشعار ${nd} يومًا، فإذا ما تبي تجدد بلّغ الموظف قبل هذا التاريخ`, art: "55" });
      else if (left < 0) a.push({ lvl: "bad", t: `فات موعد إشعار عدم التجديد (${dl}). العقد ينتهي ${e.contractEnd} وينص على إشعار ${nd} يومًا، راجع بند التجديد في العقد قبل إبلاغ الموظف`, art: "55" });
    } else if (r >= 0 && r <= 90) a.push({ lvl: r <= 30 ? "bad" : "warn", t: `العقد ينتهي بعد ${r} يومًا (${e.contractEnd}). العقد ما فيه فترة إشعار مسجلة، فإذا ما تبي تجدد بلّغ الموظف كتابيًا مبكرًا`, art: "55" });
    if (r < 0) a.push({ lvl: "bad", t: `العقد انتهى منذ ${-r} يومًا ولم يُحدّث. استمرار العمل يعني تجديده (م55)`, art: "55" });
  }
  const pe = probationEnd(e);
  if (pe) { const r = dDiff(today, pe); if (r >= 0 && r <= 30) a.push({ lvl: "warn", t: `فترة التجربة تنتهي بعد ${r} يومًا`, art: "53" }); }
  if (num(e.probationDays) > 180) a.push({ lvl: "bad", t: "فترة التجربة المسجلة تتجاوز 180 يومًا", art: "53" });
  if (e.contractType === "fixed" && e.nationality !== "non" && isEffectivelyIndefinite(e)) a.push({ lvl: "warn", t: "العقد يُعامل كغير محدد المدة (3 تجديدات أو 4 سنوات)", art: "55" });
  if (num(e.leaveBalance) > 45) a.push({ lvl: "warn", t: `رصيد إجازات مرتفع (${Math.round(num(e.leaveBalance))} يومًا) يرفع الالتزام`, art: "110" });
  const md = missingData(e); if (md.length) a.push({ lvl: "warn", t: "بيانات ناقصة: " + md.join("، ") });
  return a;
}

function lawSearch(q) {
  q = String(q || "").trim(); if (!q) return [];
  const num = q.replace(/[^\d]/g, ""), live = LAW.filter(a => !a.repealed);
  if (/^\s*(م|المادة|مادة)?\s*\d+\s*(مكرر)?\s*$/.test(q)) { const k = num + (q.includes("مكرر") ? " مكرر" : ""); const hit = LAW.filter(a => a.n === k); if (hit.length) return hit; }
  const STOP = new Set(["عمل", "العمل", "العامل", "عامل", "صاحب", "نظام", "في", "من", "على", "عن", "مع", "او", "أو", "هل", "ما", "كم", "متى", "الموظف", "موظف"]);
  let words = q.split(/\s+/).filter(w => w.length > 1 && !STOP.has(w)); if (!words.length) words = q.split(/\s+/).filter(w => w.length > 1);
  const score = all => live.map(a => { const h = a.t + " " + a.x + " " + a.tags.join(" "); let sc = 0, hit = 0; for (const w of words) { const st = w.replace(/^ال/, ""); const m = h.includes(w) || (st.length > 2 && h.includes(st)); if (m) hit++; if (a.t.includes(w) || a.t.includes(st)) sc += 3; if (a.tags.includes(w)) sc += 3; if (m) sc += 1; } return [all && hit < words.length ? 0 : sc, a]; }).filter(x => x[0] > 0).sort((x, y) => y[0] - x[0]).map(x => x[1]);
  const strict = score(true); return strict.length ? strict : score(false);
}

    return await new Promise(r => cv.toBlob(b => r(b || f), "image/jpeg", 0.88)); } catch { return f; }
}
async function fileToText(f) {
  const n = f.name.toLowerCase();
  if (n.endsWith(".txt")) return { text: await f.text() };
  if (n.endsWith(".docx")) { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"); const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); return { text: r.value }; }

    const pdf = await pdfPages(f); let out = "";
    for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) { const p = await pdf.getPage(i); const c = await p.getTextContent(); out += c.items.map(x => x.str).join(" ") + "\n"; }

    return { text: out.normalize("NFKC"), images: await pdfToImages(pdf, 6), fromPdf: true };

}

const norm = s => String(s ?? "").replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[؟?():]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
function xlDate(v) {
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v ?? "").trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return "";
}
function xlSel(k, v) {
  const s = norm(v); if (!s) return "";
  const map = SEL_MAP[k]; if (!map) return "";
  for (const [key, lab] of Object.entries(map)) if (key && (s === norm(key) || s === norm(lab))) return key;
  if (k === "nationality") return /غير|non|اجنبي|مقيم/.test(s) ? "non" : /سعود|saudi/.test(s) ? "saudi" : "";
  if (k === "gender") return /انث|f|امراه/.test(s) ? "f" : /ذكر|m/.test(s) ? "m" : "";
  if (k === "contractType") return /غير|indef|مفتوح/.test(s) ? "indefinite" : /محدد|fixed/.test(s) ? "fixed" : "";
  if (k === "noticeClause") return /لا|no/.test(s) ? "no" : /نعم|يوجد|yes/.test(s) ? "yes" : "";
  return "";
}
async function importExcel(file) {
  try { await loadScript(XLSX_URL); } catch { return toast("تعذّر تحميل أداة Excel."); }
  let rows;
  try { const wb = window.XLSX.read(await file.arrayBuffer(), { cellDates: true }); rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true }); }
  catch { return toast("تعذّرت قراءة الملف. استخدم ملف Excel (xlsx) أو CSV."); }
  const cols = {}; // header -> field key
  const heads = Object.keys(rows[0] || {});
  for (const h of heads) {
    const n = norm(h);
    const f = EMP_FIELDS.find(([k, l]) => n === norm(l) || n === norm(k)) || EMP_FIELDS.find(([k, l]) => norm(l).startsWith(n) || n.startsWith(norm(l).split(" ").slice(0, 2).join(" ")));
    if (f) cols[h] = f[0]; else if (n === norm("ملاحظات") || n === "notes") cols[h] = "notes";

  if (!Object.values(cols).includes("name")) return toast('ما لقيت عمود "الاسم الكامل" في أول صف من الملف.');
  const plan = [], skipped = [];

    const e = {};
    for (const [h, k] of Object.entries(cols)) {
      const f = EMP_FIELDS.find(x => x[0] === k), v = r[h];
      if (k === "notes") { if (String(v).trim()) e.notes = String(v).trim(); continue; }
      if (f[2] === "number") { if (String(v).trim() !== "") e[k] = toNum(v); }
      else if (f[2] === "date") { const d = xlDate(v); if (d) e[k] = d; }
      else if (f[2] === "sel") { const s = xlSel(k, v); if (s) e[k] = s; }
      else { const s = String(v ?? "").trim(); if (s) e[k] = s; }
    }
    if (!e.name) { if (Object.keys(e).length) skipped.push(i + 2); return; }
    const ex = (e.empNo && S.all.find(x => String(x.empNo) === String(e.empNo))) || (e.nationalId && S.all.find(x => String(x.nationalId) === String(e.nationalId)));

  });
  S._import = plan;
  const nw = plan.filter(p => p.kind === "new").length, up = plan.length - nw;
  const mapped = Object.entries(cols).map(([h, k]) => (EMP_FIELDS.find(f => f[0] === k)?.[1] || "ملاحظات")), ign = heads.filter(h => !cols[h]);

  <div class="dlg-b">
    <div class="facts"><div class="fact"><span>موظفون جدد</span><b>${nw}</b></div><div class="fact"><span>تحديث موظفين موجودين</span><b>${up}</b></div><div class="fact"><span>صفوف بدون اسم (تُتجاهل)</span><b>${skipped.length}</b></div></div>
    <div class="small"><b>الأعمدة المقروءة:</b> ${esc(mapped.join("، "))}</div>
    ${ign.length ? `<div class="small muted"><b>أعمدة غير معروفة (تُتجاهل):</b> ${esc(ign.join("، "))}</div>` : ""}
    ${up ? `<div class="banner info">الموظف يُعتبر موجودًا إذا تطابق الرقم الوظيفي أو رقم الهوية، وتُحدَّث بياناته بقيم الملف.</div>` : ""}
    ${plan.length ? `<div class="tablewrap"><table><thead><tr><th>الحالة</th><th>الرقم</th><th>الاسم</th><th>الإدارة</th><th>المباشرة</th><th>الأساسي</th></tr></thead><tbody>${plan.slice(0, 50).map(p => `<tr><td>${p.kind === "new" ? "جديد" : "تحديث"}</td><td>${esc(p.e.empNo || "")}</td><td>${esc(p.e.name)}</td><td>${esc(p.e.dept || "")}</td><td>${esc(p.e.startDate || "")}</td><td>${p.e.basic ? fmt(p.e.basic) : ""}</td></tr>`).join("")}</tbody></table></div>${plan.length > 50 ? `<div class="small muted">وعدد ${plan.length - 50} آخرين.</div>` : ""}` : `<div class="empty">ما في صفوف صالحة للاستيراد.</div>`}

  <div class="dlg-f">${plan.length ? `<button class="btn primary" data-act="doImport">استيراد ${plan.length} موظف</button>` : ""}<button class="btn" data-act="close">إلغاء</button></div>`);

async function doImport(btn) {
  const plan = S._import || []; if (!plan.length) return;
  btn.disabled = true; let n = 0, next = parseInt(nextEmpNo(), 10);
  for (const p of plan) {
    if (!p.e.empNo) p.e.empNo = String(next++);
    btn.textContent = `جاري الاستيراد ${++n} من ${plan.length}...`;
    try { await putEmp(p.e); } catch (er) { writeErr(er); btn.disabled = false; btn.textContent = "إعادة المحاولة"; S._import = plan.slice(n - 1); return; }
  }
  const nw = plan.filter(p => p.kind === "new").length;
  logAudit("استيراد Excel", `${nw} جديد، ${plan.length - nw} تحديث`);
  S._import = null; closeDlg(); S.empTab = "cur"; render(); toast(`تم استيراد ${plan.length} موظف`);
}

/* ===== Calendar + email notifications (Google Calendar / Gmail via the mcp capability) ===== */
const CAL = "Google Calendar", GMAIL = "Gmail", TZ = "Asia/Riyadh";
const emailsOf = () => String(S.settings.notifyEmails || "").split(/[,\s،;]+/).map(x => x.trim()).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
S.calMap = {};

function deadlines(t = todayISO()) {
  const out = [];
  for (const e of S.emps) {
    const who = `${e.name}${e.empNo ? " (" + e.empNo + ")" : ""}`, info = [e.title, e.dept].filter(Boolean).join(" · ");
    const pe = probationEnd(e);
    if (pe && pe >= t) out.push({ key: `${e.id}_prob`, date: pe, kind: "prob", empId: e.id, title: `نهاية فترة التجربة: ${who}`, desc: `${info}\nتنتهي فترة التجربة ${pe}. إذا ما يناسب الموظف، الإنهاء يكون قبل هذا التاريخ (المادة 54).` });
    if (e.contractType === "fixed" && e.contractEnd && e.contractEnd >= t) {
      const nd = e.noticeClause === "yes" ? num(e.noticeDays) : 0, dl = addDays(e.contractEnd, -(nd || 60));
      if (dl >= t) out.push({ key: `${e.id}_notice`, date: dl, kind: "notice", empId: e.id, title: nd ? `آخر موعد إشعار عدم التجديد: ${who}` : `موعد مقترح لإبلاغ عدم التجديد: ${who}`, desc: `${info}\nالعقد ينتهي ${e.contractEnd}. ${nd ? `العقد ينص على إشعار ${nd} يومًا، فإذا ما تبي تجدد لازم تبلغه كتابيًا قبل هذا التاريخ.` : "العقد ما فيه فترة إشعار مسجلة، فإذا ما تبي تجدد بلّغه كتابيًا مبكرًا."}${isEffectivelyIndefinite(e) ? "\nتنبيه: العقد تجدد 3 مرات أو بلغ 4 سنوات فيُعامل كغير محدد المدة (م55)." : ""}` });
      out.push({ key: `${e.id}_end`, date: e.contractEnd, kind: "end", empId: e.id, title: `نهاية عقد: ${who}`, desc: `${info}\nينتهي العقد محدد المدة اليوم. إذا استمر الموظف بالعمل بعده يُعد العقد مجددًا (م55).` });
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
const KIND = { prob: "نهاية تجربة", notice: "إشعار عدم التجديد", end: "نهاية عقد" };
const safeKey = k => k.replace(/[^A-Za-z0-9_-]/g, "");

function mcpErr(e, server) {
  const c = e?.code;
  return c === "server_not_connected" || c === "selection_required" ? `${server} غير مربوط بحسابك. أضفه من claude.ai ← الإعدادات ← الموصلات.`
    : c === "needs_reauth" ? `انتهى ربط ${server}. أعد ربطه من claude.ai ← الإعدادات ← الموصلات.`
    : c === "not_in_manifest" || c === "approval_required" ? `ما سمحت للمنصة تستخدم ${server}. افتح الصلاحيات من أعلى الصفحة واسمح له.`
    : c === "blocked_by_policy" ? `${server} موقوف بسياسة جهتك.`
    : c === "not_granted" || c === "capability_disabled" || c === "capability_removed" ? "الربط مع Google غير متاح في هذا العرض. افتح المنصة من claude.ai."
    : c === "tool_error" ? `${server} رفض الطلب: ${e.message || ""}`
    : `تعذّر الاتصال بـ ${server}${c ? " (" + c + ")" : ""}، حاول بعد قليل.`;
}
const eventIdOf = r => { const p = r?.payload; if (p && typeof p === "object") return p.id || p.eventId || p.event?.id || ""; const m = String(p || "").match(/"?(?:id|eventId)"?\s*[:=]\s*"([^"]+)"/); return m ? m[1] : ""; };

async function loadCalMap() {
  if (S.local || !S.db) return;
  try { const s = await S.db.collection("calsync").get(); S.calMap = {}; s.docs.forEach(d => S.calMap[d.id] = d.data()); } catch (e) { console.warn(e); }
}
async function putCal(k, v) { S.calMap[k] = v; if (!S.local && S.db) await S.db.collection("calsync").doc(k).set(v); }
async function delCal(k) { delete S.calMap[k]; if (!S.local && S.db) await S.db.collection("calsync").doc(k).delete(); }
async function saveSettingsPatch(p) {
  S.settings = { ...S.settings, ...p };
  if (!S.local && S.db) await S.db.doc("settings/company").set(S.settings);
}

async function syncCalendar({ silent = false } = {}) {
  if (!S.mcp) { if (!silent) toast("الربط مع تقويم Google يعمل عند فتح المنصة من claude.ai."); return null; }
  const emails = emailsOf(), t = todayISO(), items = deadlines(t);
  await loadCalMap();
  const want = new Map(items.map(i => [safeKey(i.key), i]));
  const stat = { added: 0, updated: 0, removed: 0 }, msg = $("#calMsg");
  const reminders = [{ method: "email", minutes: 7 * 1440 }, { method: "email", minutes: 1440 }, { method: "popup", minutes: 1440 }];
  const body = i => ({ summary: i.title, description: i.desc + "\n\nمن منصة الموارد البشرية.", allDay: true, startTime: `${i.date}T00:00:00`, endTime: `${addDays(i.date, 1)}T00:00:00`, timeZone: TZ, availability: "AVAILABILITY_FREE", overrideReminders: reminders, ...(emails.length ? { attendees: emails.map(email => ({ email })) } : {}) });
  try {
    for (const [k, i] of want) {
      const ex = S.calMap[k], sig = i.date + "|" + i.title + "|" + emails.join(",");
      if (ex && ex.sig === sig) continue;
      if (msg) msg.textContent = `جاري المزامنة: ${i.title}`;
      if (ex?.eventId) {
        const p = { eventId: ex.eventId, ...body(i) }; delete p.attendees; delete p.allDay;
        const added = emails.filter(x => !(ex.emails || []).includes(x)), removed = (ex.emails || []).filter(x => !emails.includes(x));
        if (added.length) p.addedAttendees = added.map(email => ({ email })); if (removed.length) p.removedAttendeeEmails = removed;
        await S.mcp.callTool(CAL, "update_event", { ...p, allDay: true });
        await putCal(k, { ...ex, date: i.date, title: i.title, sig, emails }); stat.updated++;
      } else {
        const r = await S.mcp.callTool(CAL, "create_event", body(i));
        await putCal(k, { eventId: eventIdOf(r), date: i.date, title: i.title, sig, emails, empId: i.empId, kind: i.kind }); stat.added++;
      }
    }
    for (const [k, ex] of Object.entries(S.calMap)) {
      if (want.has(k)) continue;
      if (ex.eventId && ex.date >= t) { try { await S.mcp.callTool(CAL, "delete_event", { eventId: ex.eventId, notificationLevel: "ALL" }); } catch (e) { if (e?.code !== "tool_error") throw e; } stat.removed++; }
      await delCal(k);
    }
    await saveSettingsPatch({ calSyncedAt: new Date().toISOString(), autoSync: S.settings.autoSync !== false });
    const ch = stat.added + stat.updated + stat.removed;
    if (ch) logAudit("مزامنة تقويم Google", `أضيف ${stat.added}، حُدّث ${stat.updated}، حُذف ${stat.removed}`);
    if (!silent || ch) toast(ch ? `التقويم: أضيف ${stat.added} موعد، حُدّث ${stat.updated}، حُذف ${stat.removed}` : "التقويم محدّث، ما فيه مواعيد جديدة");
    if (S.view === "settings") render();
    return stat;
  } catch (e) {
    console.warn(e); const m = mcpErr(e, CAL);
    if (msg) msg.textContent = m; if (!silent) toast(m);
    return null;
  }
}

    ${alerts.length ? `<h3 style="margin:16px 0 6px;color:#b23a2e">تنبيهات عاجلة (${alerts.length})</h3><ul>${alerts.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
    <p style="color:#5f6b70;font-size:13px;margin-top:18px">أُرسل من منصة الموارد البشرية.</p></div>`;
  const text = [`تنبيهات الموارد البشرية - ${co} - ${t}`, "", `مواعيد خلال 60 يوم (${soon.length}):`, ...soon.map(i => `${i.date} (بعد ${dDiff(t, i.date)} يوم): ${i.title}`), ...(alerts.length ? ["", "تنبيهات عاجلة:", ...alerts] : [])].join("\n");
  const btn = $('[data-act="sendDigest"]'); if (btn) btn.disabled = true;
  try {
    await S.mcp.callTool(GMAIL, "send_message", { to: emails, subject: `تنبيهات الموارد البشرية - ${co} - ${t}`, body: text, htmlBody: html });
    await saveSettingsPatch({ digestSentAt: new Date().toISOString() });
    logAudit("إرسال ملخص التنبيهات بالإيميل", emails.join("، ")); toast(`أُرسل الملخص إلى ${emails.join("، ")}`);
  } catch (e) { console.warn(e); toast(mcpErr(e, GMAIL)); }
  finally { if (btn) btn.disabled = false; }
}

function sickUse(empId, t = todayISO()) {

/* estimated balance from start date: years served x yearly entitlement (30 after year 5) minus recorded deducted leave */
/* balance is computed live: earned since start date (contract days per year, 30 after year 5)
   minus days used before the system minus annual leave recorded here */
function leaveCalc(e, t = todayISO()) {
  const end = e.left && e.exitDate && e.exitDate < t ? e.exitDate : t;

  const y = Math.max(0, dDiff(e.startDate, end)) / 365, base = num(e.annualLeaveDays) || 21, hi = Math.max(base, 30);

  return { acc: days1(acc), used, taken, bal: days1(acc - used - taken) };

/* ===== Saudization (Nitaqat) estimate from current employees ===== */
const NQ_SRC = "https://www.hrsd.gov.sa/ar/media-center/news/777585";
function gosiWage(e) { return num(e.basic) + num(e.housing); }
function nqWeight(e) { const w = gosiWage(e); return w >= 4000 ? 1 : w >= 3000 ? 0.5 : 0; }
function nitaq(target = num(S.settings.nitaqTarget)) {
  const all = S.emps, sa = all.filter(e => e.nationality === "saudi"), non = all.length - sa.length;
  const s = sa.reduce((x, e) => x + nqWeight(e), 0), tot = s + non, pct = tot ? s / tot * 100 : 0, p = target / 100;
  const need = p && pct < target ? Math.ceil((p * tot - s) / (1 - p) - 1e-9) : 0;
  const room = p && pct >= target ? Math.floor(s / p - tot + 1e-9) : 0;
  return { all, sa, non, s, tot, pct, target, need, room, half: sa.filter(e => nqWeight(e) === 0.5), zero: sa.filter(e => nqWeight(e) === 0) };
}
